name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start IoT Prism mock server
        run: |
          npx prism mock contracts/iot-ingestion.openapi.yaml -p 4010 --host 127.0.0.1 > prism-iot.log 2>&1 &
          echo $! > prism-iot.pid
        shell: bash

      - name: Start AI Vision Prism mock server
        run: |
          npx prism mock contracts/ai-vision.openapi.yaml -p 4011 --host 127.0.0.1 > prism-vision.log 2>&1 &
          echo $! > prism-vision.pid
        shell: bash

      - name: Wait for IoT mock server with curl retry
        run: |
          for i in {1..120}; do
            if curl -f http://127.0.0.1:4010/health > /dev/null 2>&1; then
              echo "IoT server is ready"
              exit 0
            fi
            echo "Attempt $i/120: Waiting for IoT server..."
            sleep 1
          done
          echo "IoT server failed to start after 120 seconds"
          cat prism-iot.log
          exit 1
        shell: bash

      - name: Wait for AI Vision mock server with curl retry
        run: |
          for i in {1..120}; do
            if curl -f http://127.0.0.1:4011/health > /dev/null 2>&1; then
              echo "Vision server is ready"
              exit 0
            fi
            echo "Attempt $i/120: Waiting for Vision server..."
            sleep 1
          done
          echo "Vision server failed to start after 120 seconds"
          cat prism-vision.log
          exit 1
        shell: bash

      - name: Run Newman contract tests
        run: npm run test:mock

      - name: Show Prism logs on failure
        if: failure()
        run: |
          echo "=== IoT Prism Log ==="
          cat prism-iot.log || true
          echo -e "\n=== AI Vision Prism Log ==="
          cat prism-vision.log || true
          echo -e "\n=== Network interfaces ==="
          ss -tlnp || netstat -tlnp || true
          echo -e "\n=== Process check ==="
          ps aux | grep prism || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
